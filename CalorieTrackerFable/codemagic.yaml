workflows:
  android-apk:
    name: CalTrack Android APK
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      node: 22
      java: 17

    scripts:
      - name: Locate Expo project
        script: |
          set -e
          if [ -f "package.json" ]; then
            export APP_DIR="."
          elif [ -f "CalorieTrackerFable/package.json" ]; then
            export APP_DIR="CalorieTrackerFable"
          else
            echo "ERROR: package.json not found."
            echo "Put the Expo project files in the repository root or in CalorieTrackerFable/"
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" > "$CM_ENV"

      - name: Install dependencies
        script: |
          set -e
          cd "$APP_DIR"
          npm ci

      - name: Generate Android project with Expo
        script: |
          set -e
          cd "$APP_DIR"
          npx expo prebuild --platform android --non-interactive

      - name: Configure Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$APP_DIR/android/local.properties"

      - name: Build APK
        script: |
          set -e
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - "**/android/app/build/outputs/apk/debug/*.apk"
