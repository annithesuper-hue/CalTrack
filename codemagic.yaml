workflows:
  ios-unsigned-ipa:
    name: CalTrack iOS Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      node: 22
      groups:
        - caltrack-secrets

    scripts:
      - name: Install dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable"
          npm ci

      - name: Check required API keys
        script: |
          set -e
          missing=0

          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "ERROR: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is missing."
            missing=1
          else
            echo "Clerk Publishable Key detected."
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            missing=1
          else
            echo "Gemini API key detected."
          fi

          if [ -z "$USDA_API_KEY" ]; then
            echo "ERROR: USDA_API_KEY is missing."
            missing=1
          else
            echo "USDA API key detected."
          fi

          if [ "$missing" -eq 1 ]; then
            echo "Add the missing key(s) to the Codemagic group: caltrack-secrets"
            exit 1
          fi

      - name: Generate iOS project
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable"
          npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable/ios"
          pod install

      - name: Build unsigned iOS app
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable"

          xcodebuild \
            -workspace "ios/CalTrack.xcworkspace" \
            -scheme "CalTrack" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/ios-build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/ios-build/Build/Products/Release-iphoneos/CalTrack.app"
          IPA_DIR="$CM_BUILD_DIR/unsigned-ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: CalTrack.app was not produced."
            exit 1
          fi

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          cp -R "$APP_PATH" "$IPA_DIR/Payload/CalTrack.app"

          cd "$IPA_DIR"
          zip -r "$CM_BUILD_DIR/CalTrack-unsigned.ipa" Payload

          echo "Unsigned IPA created:"
          echo "$CM_BUILD_DIR/CalTrack-unsigned.ipa"

    artifacts:
      - "CalTrack-unsigned.ipa"
      - "/tmp/xcodebuild_logs/*.log"
