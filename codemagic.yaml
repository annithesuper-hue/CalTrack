workflows:
  ios-unsigned:
    name: CalTrack iOS Unsigned
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: 22
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable"
          npm ci

      - name: Generate iOS project
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable"
          npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable/ios"
          pod install

      - name: Build unsigned iOS app
        script: |
          set -e
          cd "$CM_BUILD_DIR/CalorieTrackerFable"

          xcodebuild \
            -workspace "ios/CalTrack.xcworkspace" \
            -scheme "CalTrack" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

    artifacts:
      - "CalorieTrackerFable/build/ios/Build/Products/Release-iphoneos/*.app"
